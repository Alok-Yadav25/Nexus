name: nexus
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d nexus"]
      interval: 5s
      retries: 20
  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes: [neo4j_data:/data]
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.16.3
    volumes: [qdrant_data:/qdrant/storage]
    ports: ["127.0.0.1:6333:6333"]
    healthcheck:
      test: [CMD-SHELL, "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      retries: 30
  ai:
    build: ./ai-service
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_ENABLED: ${GROQ_ENABLED:-true}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-45}
      GROQ_MAX_OUTPUT_TOKENS: ${GROQ_MAX_OUTPUT_TOKENS:-2048}
      GROQ_DAILY_REQUEST_BUDGET: ${GROQ_DAILY_REQUEST_BUDGET:-100}
      NEXUS_RESEARCH_CONTACT: ${NEXUS_RESEARCH_CONTACT:-}
    volumes: [ai_data:/data]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 30
  backend:
    build: ./backend
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://postgres:5432/nexus
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      ai: {condition: service_healthy}
      qdrant: {condition: service_started}
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:8080/actuator/health']
      interval: 10s
      start_period: 30s
      retries: 30
  frontend:
    build: ./frontend
    environment:
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      HTTPS_DEPLOYMENT: ${HTTPS_DEPLOYMENT:-false}
    depends_on:
      backend: {condition: service_healthy}
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 20
volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  qdrant_data:
  ai_data:
