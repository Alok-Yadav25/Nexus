name: Verify NEXUS
on: [push, pull_request]
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: ./backend/mvnw -f backend/pom.xml verify -B
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: ai-service/requirements.lock.txt}
      - run: pip install -r ai-service/requirements.lock.txt
      - run: python -m pytest -q
        working-directory: ai-service
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python3 infrastructure/scripts/init_env.py
      - run: docker compose config --quiet && docker compose up -d --build --wait --wait-timeout 600
      - name: Run browser tests with preinstalled Chrome
        run: |
          npm ci
          PLAYWRIGHT_CHROME_PATH=$(command -v google-chrome)
          export PLAYWRIGHT_CHROME_PATH
          "$PLAYWRIGHT_CHROME_PATH" --version
          npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            compose.log
            frontend/test-results/
            frontend/playwright-report/
      - if: always()
        run: docker compose down
